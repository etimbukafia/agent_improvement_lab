name: quality

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check src tests examples
      - run: python -m ruff check src tests examples
      - run: python -m mypy src examples
      - run: python -m pytest
      - run: python -m pytest tests/test_phase2.py tests/test_phase6.py
      - run: python -m compileall -q src tests examples
      - run: python -m examples.calculator_agent.run_cycle --output-dir artifacts/ci-calculator-reports
