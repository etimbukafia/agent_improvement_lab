[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "enterprise-agent-improvement-lab"
version = "0.1.0"
description = "Evaluation and controlled improvement tools for AI agents"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
]

[project.scripts]
enterprise-agent-improvement-lab = "enterprise_agent_improvement_lab.cli:main"

[project.optional-dependencies]
test = ["pytest==9.1.1"]
evals = ["pydantic-evals==2.33.0"]
dev = [
    "pytest==9.1.1",
    "pydantic-evals==2.33.0",
    "ruff==0.16.4",
    "mypy==2.3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_agent_improvement_lab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["enterprise_agent_improvement_lab"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
show_error_codes = true
